# Талисман Барьера
barrier:
  # Радиус, в котором отбрасываются игроки вокруг владельца (в блоках).
  radius: 6.0
  # Сила горизонтального отбрасывания.
  strength: 1.6
  # Вертикальная составляющая отбрасывания.
  vertical: 0.55

# Талисман Энда
ender:
  # Базовая дистанция телепортации в направлении взгляда (в блоках).
  distance: 8.0
  # Разброс телепортации по горонтали (плюс/минус блоки).
  spread: 2.0

# Сообщения
messages:
  prefix: '&6[Талисманы] &r'
  trigger: '&a%talisman% сработал и спас вас от смерти!'
  trigger-others: '&e%player% был спасён талисманом &6%talisman%&e!'
  given: '&aВыдано: &f%amount%x &6%talisman% &aигроку &f%player%&a.'
  reload: '&aКонфигурация перезагружена.'
  no-permission: '&cУ вас нет прав.'
  player-not-found: '&cИгрок &f%player% &cне найден.'
  unknown-type: '&cНеизвестный тип талисмана: &f%type%&c. Доступно: %types%'
  usage: '&cИспользование: /talisman <give|list|reload>'
